services:
  - type: web
    name: bezawada-biryani-house
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: SQLITE_PATH
        value: /tmp/foodbiz.sqlite
