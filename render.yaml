services:
  - type: web
    name: bezawada-biryani-house
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: SQLITE_PATH
        value: /var/data/foodbiz.sqlite
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
