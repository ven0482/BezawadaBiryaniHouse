<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card">
      <div class="section-head section-with-back">
        <h1>My Profile</h1>
        <a class="btn btn-outline btn-sm" href="admin.html">Back</a>
      </div>
      <form id="adminProfileForm" class="admin-form">
        <label>
          First Name
          <input type="text" id="adminProfileFirstName" required />
        </label>
        <label>
          Last Name
          <input type="text" id="adminProfileLastName" required />
        </label>
        <label>
          Email
          <input type="email" id="adminProfileEmail" disabled />
        </label>
        <label>
          Role
          <input type="text" id="adminProfileRole" disabled />
        </label>
        <label>
          New Password (optional)
          <input type="password" id="adminProfilePassword" />
        </label>
        <label>
          Theme Mode
          <select id="adminProfileThemeMode">
            <option value="day">Day Mode</option>
            <option value="night">Night Mode</option>
          </select>
        </label>
        <label>
          Currency
          <select id="adminProfileCurrency">
            <option value="INR" selected>INR</option>
            <option value="USD">USD</option>
          </select>
        </label>
        <div class="form-actions">
          <button class="btn" type="submit">Update Admin Profile</button>
        </div>
      </form>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
