<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout" id="reportsPage">
    <section class="card">
      <div class="section-head section-with-back">
        <h1>Reports</h1>
        <a class="btn btn-outline btn-sm" href="admin.html">Back</a>
      </div>

      <div class="reports-filters-grid">
        <label>
          Report Type
          <select id="reportType">
            <option value="ORDERS">Orders Report</option>
            <option value="CUSTOMERS">Customers Report</option>
            <option value="ADMINS">Admins Report</option>
            <option value="INVENTORY">Inventory Report</option>
            <option value="LOW_STOCK">Low Stock Report</option>
            <option value="CATEGORY_REVENUE">Revenue By Category</option>
            <option value="PAYMENT_METHOD">Payment By Method</option>
          </select>
        </label>
        <label>
          Search
          <input id="reportSearch" type="text" placeholder="Search text" />
        </label>
        <label>
          Date From
          <input id="reportDateFrom" type="date" />
        </label>
        <label>
          Date To
          <input id="reportDateTo" type="date" />
        </label>
        <label id="reportStatusWrap">
          Status
          <select id="reportStatus">
            <option value="ALL">All</option>
            <option value="OPEN">Open</option>
            <option value="PENDING">Pending</option>
            <option value="CLOSED">Closed</option>
          </select>
        </label>
        <label id="reportChannelWrap">
          Channel
          <select id="reportChannel">
            <option value="ALL">All</option>
            <option value="ONLINE">Online</option>
            <option value="DINE_IN">Dine In</option>
            <option value="PHONE_ORDER">Phone Order</option>
          </select>
        </label>
        <label id="reportCategoryWrap">
          Category
          <select id="reportCategory">
            <option value="ALL">All</option>
          </select>
        </label>
        <label id="reportLowStockWrap" class="hidden">
          Low Stock <=
          <input id="reportLowStock" type="number" min="0" value="10" />
        </label>
      </div>

      <div class="form-actions">
        <button class="btn btn-sm" type="button" id="generateReportBtn">Generate</button>
        <button class="btn btn-outline btn-sm" type="button" id="exportReportCsvBtn">Export CSV</button>
        <button class="btn btn-outline btn-sm" type="button" id="exportReportPdfBtn">Export PDF</button>
      </div>

      <p class="small" id="reportStatusText"></p>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead id="reportTableHead"></thead>
          <tbody id="reportTableBody"></tbody>
        </table>
      </div>
      <div id="reportsPagination" class="pagination-row"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
