<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Items | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <a href="dine-in.html">Dine In</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout" id="dineInAddItemsPage">
    <section class="card">
      <div class="section-head section-with-back">
        <h1 id="dineInAddItemsTitle">Add Items</h1>
        <div class="head-actions">
          <button class="btn btn-sm" type="button" id="dineInAddItemsSubmitBtn">Add Items</button>
          <a class="btn btn-outline btn-sm" id="dineInAddItemsCloseBtn" href="dine-in.html">Close</a>
        </div>
      </div>
      <p class="small" id="dineInAddItemsStatus"></p>
      <div class="order-top-actions">
        <div id="dineInAddItemsCategories" class="pill-row"></div>
      </div>
    </section>

    <section class="card">
      <h2>Items Added To Order</h2>
      <div id="dineInAddItemsSelectedItems" class="cart-items"></div>
      <div class="cart-summary">
        <div class="total"><span>Selected Total</span><strong id="dineInAddItemsSelectedTotal">₹0</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>Menu</h2>
      <div id="dineInAddItemsMenuGrid" class="product-grid"></div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
