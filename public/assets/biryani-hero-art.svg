    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1440 360) rotate(149) scale(1020 560)">
      <stop offset="0" stop-color="#FFA84E" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#FFA84E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 910) rotate(90) scale(240 730)">
