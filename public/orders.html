<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card" id="ordersFeature">
      <div class="section-head section-with-back">
        <h1>Orders</h1>
        <a class="btn btn-outline btn-sm" href="admin.html">Back</a>
      </div>

      <label>
        Search Orders
        <input id="ordersSearchInput" type="text" placeholder="Search by order ID, table, channel, customer, phone, status" />
      </label>

      <div id="orderStatusFilters" class="pill-row">
        <button type="button" class="pill active" data-status="ALL">All</button>
        <button type="button" class="pill" data-status="OPEN">Open</button>
        <button type="button" class="pill" data-status="PENDING">Pending</button>
        <button type="button" class="pill" data-status="CLOSED">Closed</button>
      </div>

      <div id="orderChannelFilters" class="pill-row">
        <button type="button" class="pill active" data-channel="ALL">All Channels</button>
        <button type="button" class="pill" data-channel="DINE_IN">Dine In</button>
        <button type="button" class="pill" data-channel="PHONE_ORDER">Phone Order</button>
        <button type="button" class="pill" data-channel="ONLINE">Online</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Source</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Items</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
      <div id="ordersPagination" class="pagination-row"></div>
    </section>

  </main>

  <script src="assets/app.js"></script>
</body>
</html>
