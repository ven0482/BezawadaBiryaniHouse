<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Admin | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card">
      <div class="section-head section-with-back">
        <h1>Create Admin</h1>
        <a class="btn btn-outline btn-sm" href="admin.html">Back</a>
      </div>

      <form id="createAdminForm" class="admin-form">
        <label>
          First Name
          <input type="text" id="createAdminFirstName" required />
        </label>
        <label>
          Last Name
          <input type="text" id="createAdminLastName" required />
        </label>
        <label>
          Email
          <input type="email" id="createAdminEmail" required />
        </label>
        <label>
          Phone (optional)
          <input type="tel" id="createAdminPhone" />
        </label>
        <label>
          Temporary Password (optional)
          <input type="text" id="createAdminPassword" placeholder="Leave blank to auto-generate" />
        </label>
        <div class="form-actions">
          <button class="btn" type="submit">Create Admin</button>
        </div>
      </form>
    </section>

    <section class="card hidden" id="createAdminResult">
      <h2>Admin Created</h2>
      <p class="small" id="createAdminStatusMessage"></p>
      <div id="createAdminResultBody"></div>
    </section>

    <section class="card">
      <h2>Search Existing Admins</h2>
      <div class="admin-form">
        <label>
          Name / Email / Phone
          <input type="text" id="adminSearchQuery" placeholder="Type name, email or phone" />
        </label>
      </div>
      <div class="form-actions">
        <button class="btn btn-sm" type="button" id="adminSearchBtn">Search</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Admin ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminSearchResultsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
