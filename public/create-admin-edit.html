<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Admin | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout" id="createAdminEditPage">
    <section class="card">
      <div class="section-head section-with-back">
        <h1>Update Admin</h1>
        <a class="btn btn-outline btn-sm" href="create-admin.html">Back</a>
      </div>

      <form id="updateAdminForm" class="admin-form">
        <input type="hidden" id="updateAdminId" />
        <label>
          First Name
          <input type="text" id="updateAdminFirstName" required />
        </label>
        <label>
          Last Name
          <input type="text" id="updateAdminLastName" required />
        </label>
        <label>
          Email
          <input type="email" id="updateAdminEmail" required />
        </label>
        <label>
          Phone (optional)
          <input type="tel" id="updateAdminPhone" />
        </label>
        <label>
          New Password (optional)
          <input type="text" id="updateAdminPassword" placeholder="Optional if resetting" />
        </label>
        <label class="checkbox">
          <input type="checkbox" id="updateAdminResetPassword" />
          Reset password and show updated password
        </label>
        <div class="form-actions">
          <button class="btn" type="submit">Update Admin</button>
        </div>
      </form>
    </section>

    <section class="card hidden" id="updateAdminResult">
      <h2>Updated Admin Credentials</h2>
      <p class="small" id="updateAdminStatusMessage"></p>
      <div id="updateAdminResultBody"></div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
