<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card">
      <div class="section-head section-with-back">
        <h1 id="inventoryFormTitle">Add Inventory</h1>
        <a class="btn btn-outline btn-sm" href="inventory.html">Back To Inventory</a>
      </div>

      <form id="inventoryForm" class="admin-form">
        <input type="hidden" id="inventoryProductId" />
        <label>
          Product Name
          <input type="text" id="inventoryName" required placeholder="Example: Paneer Biryani" />
        </label>
        <label>
          Category
          <input type="text" id="inventoryCategory" required placeholder="Example: Biryani" />
        </label>
        <label>
          SKU
          <input type="text" id="inventorySku" required placeholder="Example: BRY-001" />
        </label>
        <label>
          Price (INR)
          <input type="number" id="inventoryPrice" min="1" required placeholder="220" />
        </label>
        <label>
          Stock Quantity
          <input type="number" id="inventoryStock" min="0" required placeholder="50" />
        </label>
        <label>
          Image URL (optional)
          <input type="url" id="inventoryImage" placeholder="https://..." />
          <span class="small">If left blank, image will be auto-generated from product name and description.</span>
        </label>
        <div class="form-actions">
          <button class="btn btn-outline btn-sm" type="button" id="inventoryGenerateImageBtn">Generate Photo</button>
        </div>
        <label>
          Upload Photo (optional)
          <input type="file" id="inventoryImageFile" accept="image/*" />
          <span class="small">Uploaded image is converted to image data automatically.</span>
        </label>
        <img id="inventoryImagePreview" class="inventory-image-preview hidden" alt="Inventory image preview" />
        <label>
          Description
          <textarea id="inventoryDescription" required placeholder="Short product description"></textarea>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="inventoryActive" checked />
          Active (visible in shop)
        </label>
        <div class="form-actions">
          <button class="btn" id="inventorySubmitBtn" type="submit">Add Inventory</button>
          <a class="btn btn-outline" href="inventory.html">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
