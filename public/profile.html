<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="home.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">My Profile</a>
        <a href="customer-orders.html">Orders</a>
        <button class="btn btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card">
      <h1>Customer Profile</h1>
      <form id="profileForm" class="admin-form">
        <label>First Name <input type="text" id="profileFirstName" required /></label>
        <label>Last Name <input type="text" id="profileLastName" required /></label>
        <label>Phone <input type="tel" id="profilePhone" required /></label>
        <label>Address <textarea id="profileAddress" required></textarea></label>
        <label>
          Theme Mode
          <select id="profileThemeMode">
            <option value="day">Day Mode</option>
            <option value="night">Night Mode</option>
          </select>
        </label>
        <div class="form-actions">
          <button class="btn" type="submit">Update Profile</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>My Orders</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Type</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="myOrdersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
