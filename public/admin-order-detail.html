<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Detail | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <a href="orders.html">Orders</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout" id="adminOrderDetailPage">
    <section class="card">
      <div class="section-head section-with-back">
        <h1 id="adminOrderTitle">Order</h1>
        <a class="btn btn-outline btn-sm" id="adminOrderCloseBtn" href="orders.html">Close</a>
      </div>

      <div class="order-meta-grid" id="adminOrderMeta"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>SKU</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Line Total</th>
            </tr>
          </thead>
          <tbody id="adminOrderItemsBody"></tbody>
        </table>
      </div>

      <div class="invoice-totals">
        <div><span>Subtotal</span><strong id="adminOrderSubtotal">₹0</strong></div>
        <div><span>Delivery</span><strong id="adminOrderDelivery">₹0</strong></div>
        <div class="total"><span>Total</span><strong id="adminOrderTotal">₹0</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>Update Order</h2>
      <p class="small" id="adminOrderStatusMessage"></p>
      <div id="cashPaidArea" class="hidden" style="margin-bottom:1rem;padding:1rem;background:var(--surface-alt,#f5f5f5);border-radius:8px">
        <p class="small" style="margin-bottom:.5rem">This is a <strong>Cash on Delivery</strong> order. Confirm cash was received from the customer.</p>
        <button class="btn btn-sm" type="button" id="markCashPaidBtn">Mark as Paid — Cash</button>
      </div>
      <form id="adminOrderEditForm" class="admin-form">
        <label>
          Source
          <select id="adminOrderChannel">
            <option value="ONLINE">Online</option>
            <option value="DINE_IN">Dine In</option>
            <option value="PHONE_ORDER">Phone Order</option>
          </select>
        </label>

        <label id="adminOrderTableWrap" class="hidden">
          <span id="adminOrderSlotLabel">Table No</span>
          <input type="text" id="adminOrderTableNo" placeholder="Example: T12" />
        </label>

        <label>
          Order Type
          <select id="adminOrderType">
            <option value="DELIVERY">Delivery</option>
            <option value="PICKUP">Pickup</option>
          </select>
        </label>

        <label>
          Customer First / Full Name
          <input type="text" id="adminOrderCustomerName" required />
        </label>

        <label>
          Customer Phone
          <input type="tel" id="adminOrderCustomerPhone" placeholder="Optional for dine in" />
        </label>

        <label id="adminOrderAddressWrap">
          Delivery Address
          <textarea id="adminOrderAddress"></textarea>
        </label>

        <label>
          Status
          <select id="adminOrderStatus">
            <option value="OPEN">Open</option>
            <option value="PENDING">Pending</option>
            <option value="CLOSED">Closed</option>
          </select>
        </label>

        <label>
          Payment Status
          <select id="adminOrderPaymentStatus">
            <option value="INITIATED">Initiated</option>
            <option value="PAID">Paid</option>
            <option value="FAILED">Failed</option>
            <option value="REFUNDED">Refunded</option>
          </select>
        </label>

        <div class="form-actions">
          <button class="btn" type="submit">Update Order</button>
          <a class="btn btn-outline" id="adminOrderCloseBtn2" href="orders.html">Close</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const back = String(params.get("back") || "orders.html").trim() || "orders.html";
      const close2 = document.getElementById("adminOrderCloseBtn2");
      if (close2) close2.setAttribute("href", back);
    })();
  </script>
  <script src="assets/app.js"></script>
</body>
</html>
