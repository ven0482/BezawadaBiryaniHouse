<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers | Bezawada Biryani House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="admin.html"><img src="assets/bezawada-biryani-house-logo.svg" alt="Bezawada Biryani House" /></a>
      <div class="nav-links">
        <a href="admin.html">Home</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="admin-layout">
    <section class="card">
      <div class="section-head section-with-back">
        <h1>Customers</h1>
        <div class="form-actions">
          <button class="btn btn-outline btn-sm hidden" id="closeCustomersPageBtn" type="button">Close and Return</button>
          <a class="btn btn-outline btn-sm" href="admin.html" id="customersBackLink">Back</a>
        </div>
      </div>

      <label>
        Search Customers
        <input id="customersSearchInput" type="text" placeholder="Search by ID, name, phone, status" />
      </label>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Phone</th>
              <th>Registered Date</th>
              <th>Total Orders</th>
              <th>Total Spent</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="customersPageTableBody"></tbody>
        </table>
      </div>
      <div id="customersPagination" class="pagination-row"></div>
    </section>

    <section class="card hidden" id="customerEditSection">
      <h2>Update Customer Details</h2>
      <form id="customerEditForm" class="admin-form">
        <input type="hidden" id="editCustomerId" />
        <label>
          First Name
          <input type="text" id="editCustomerFirstName" required />
        </label>
        <label>
          Last Name
          <input type="text" id="editCustomerLastName" required />
        </label>
        <label>
          Phone
          <input type="tel" id="editCustomerPhone" required />
        </label>
        <div class="form-actions">
          <button class="btn" type="submit">Update Customer</button>
          <button class="btn btn-outline" type="button" id="cancelCustomerEditBtn">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
